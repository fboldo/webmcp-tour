name: Release

# Manual release: Actions > Release > Run workflow.
# New tag: bumps package.json to the tag's version on `ref` if needed, re-pins the CDN snippets,
# runs the full gate, commits "Release vX.Y.Z", tags that commit, publishes to npm (trusted
# publishing, no token) and creates the GitHub Release.
# Existing tag: checks the tag out (never moves it) and only does what is still missing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        type: string
      ref:
        description: "Branch to release from (new tags only; ignored when the tag already exists)"
        required: true
        default: main
        type: string
      dry_run:
        description: "Run everything except the commit/tag push, npm publish and GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write # push the release commit and tag, create the GitHub Release
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAG: ${{ inputs.tag }}
      REF: ${{ inputs.ref }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag and checkout
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z (semver)."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
            git fetch --tags --force origin
            git checkout --detach "refs/tags/$TAG"
            echo "Tag $TAG exists: released from the tag itself ('ref' is ignored)."
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
            if ! git ls-remote --exit-code --heads origin "refs/heads/$REF" > /dev/null; then
              echo "::error::'$REF' is not a branch. A new tag must be released from a branch."
              exit 1
            fi
            git fetch origin "$REF"
            git checkout -B "$REF" "origin/$REF"
            echo "Tag $TAG is new: releasing from $REF at $(git rev-parse --short HEAD)."
          fi

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Use npm >= 11.5.1 (required for trusted publishing)
        run: npm install -g npm@^11.5.1 && npm --version

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium and Firefox for Vitest browser mode
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Bump version and re-pin CDN snippets (new tag only)
        if: env.TAG_EXISTS == 'false'
        run: |
          current="$(node -p "require('./package.json').version")"
          if [ "$current" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi
          pnpm release:prepare
          if git diff --quiet; then
            echo "BUMPED=false" >> "$GITHUB_ENV"
          else
            echo "BUMPED=true" >> "$GITHUB_ENV"
          fi

      - name: Tag matches package.json version
        run: |
          actual="$(node -p "require('./package.json').version")"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $actual. Existing tags are never moved: bump the version and release a new tag."
            exit 1
          fi

      - run: pnpm check
      - run: pnpm docs:build

      - name: README SRI hash matches the fresh build
        run: |
          built="sha384-$(openssl dgst -sha384 -binary dist/webmcp-tour.js | openssl base64 -A)"
          documented="$(grep -oE "webmcp-tour@${VERSION}/dist/webmcp-tour\.js\" integrity=\"sha384-[^\"]+\"" README.md | head -1 | grep -oE 'sha384-[^"]+' || true)"
          if [ "$documented" != "$built" ]; then
            echo "::error::README integrity ('$documented') differs from the built dist/webmcp-tour.js ('$built')."
            exit 1
          fi

      - name: Commit release and push tag
        if: env.TAG_EXISTS == 'false' && env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BUMPED" = "true" ]; then
            git commit -am "Release $TAG"
            if ! git push origin "HEAD:refs/heads/$REF"; then
              echo "::error::Could not push the release commit to '$REF' (branch protection, or the branch moved). Allow github-actions[bot] to push to '$REF' (see RELEASING.md) and run again. Nothing was tagged or published."
              exit 1
            fi
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
          echo "TAGGED=true" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          published="$(npm view "$name@$VERSION" version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "NPM=already published" >> "$GITHUB_ENV"
          elif [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --access public
            echo "NPM=dry run only" >> "$GITHUB_ENV"
          else
            npm publish --provenance --access public
            echo "NPM=published" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "RELEASE=already exists" >> "$GITHUB_ENV"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "RELEASE=dry run only" >> "$GITHUB_ENV"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
            echo "RELEASE=created" >> "$GITHUB_ENV"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release $TAG"
            echo
            echo "- Mode: $([ "$DRY_RUN" = "true" ] && echo "dry run" || echo "real")"
            if [ "${TAG_EXISTS:-}" = "true" ]; then
              echo "- Tag: already existed, left untouched"
            else
              echo "- Tag: new, from \`$REF\`; package.json/snippets changed by the bump: ${BUMPED:-unknown}; tag pushed: ${TAGGED:-no}"
            fi
            echo "- npm: ${NPM:-not reached}"
            echo "- GitHub Release: ${RELEASE:-not reached}"
            if [ "${NPM:-}" = "already published" ] && [ "${RELEASE:-}" = "already exists" ]; then
              echo
              echo "**Nothing to do: $TAG is fully released.**"
            fi
            if [ "$DRY_RUN" = "true" ] && [ "${BUMPED:-}" = "true" ]; then
              echo
              echo "<details><summary>Bump diff (not committed)</summary>"
              echo
              echo '```diff'
              git diff | head -c 40000
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
