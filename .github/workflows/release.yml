name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # dry run: everything except publish and GitHub Release

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Use npm >= 11.5.1 (required for trusted publishing)
        run: npm install -g npm@^11.5.1 && npm --version

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium and Firefox for Vitest browser mode
        run: pnpm exec playwright install --with-deps chromium firefox

      - run: pnpm check
      - run: pnpm docs:build

      - name: Tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - name: README SRI hash matches the fresh build
        run: |
          version="$(node -p "require('./package.json').version")"
          built="sha384-$(openssl dgst -sha384 -binary dist/webmcp-tour.js | openssl base64 -A)"
          documented="$(grep -oE "webmcp-tour@${version}/dist/webmcp-tour\.js\" integrity=\"sha384-[^\"]+\"" README.md | head -1 | grep -oE 'sha384-[^"]+' || true)"
          if [ "$documented" != "$built" ]; then
            echo "::error::README integrity ($documented) differs from the built dist/webmcp-tour.js ($built). Run pnpm release:prepare."
            exit 1
          fi

      - name: Publish to npm (dry run)
        if: github.ref_type != 'tag'
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: github.ref_type == 'tag'
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
