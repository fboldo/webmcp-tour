<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overlay fixture</title>
<link rel="stylesheet" href="/fx/reset.css">
<link rel="stylesheet" href="/fx/page.css">
<script type="module" src="/test/harness.ts"></script>
</head>
<body>
<header class="sticky">Sticky header <button class="btn" id="t-header">Account</button></header>
<main>
  <section><h2>Plain target</h2><p>Normal flow. <button class="btn" id="t-plain">Change plan</button></p></section>
  <section>
    <h2>Nested scroll containers</h2>
    <div class="outer" id="outer">
      <div class="pad"></div>
      <div class="inner" id="inner">
        <div class="pad"></div>
        <button class="btn" id="t-scroll">Billing settings</button>
        <div class="pad"></div>
      </div>
      <div class="pad"></div>
    </div>
  </section>
  <section><h2>Transformed ancestor</h2><div class="transformed"><p>Inside: <button class="btn" id="t-transform">Export</button></p></div></section>
  <section><h2>contain + filter + will-change ancestor</h2><div class="contained"><p>Trap: <button class="btn" id="t-contained">Invite</button></p></div></section>
  <section>
    <h2>Modal dialog</h2>
    <dialog id="dlg">
      <h3>Confirm plan change</h3>
      <p><button class="btn" id="t-dialog">Confirm</button> <button class="btn" id="dlg-close">Cancel</button></p>
    </dialog>
  </section>
  <div class="spacer"></div>
  <section><p>Bottom of page: <button class="btn" id="t-bottom">Delete account</button></p></section>
  <div class="spacer"></div>
</main>
<div class="banner" id="banner">Cookie banner (position: fixed; z-index: 2147483647)</div>
</body>
</html>
